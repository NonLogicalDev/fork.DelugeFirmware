[layer]
depends-on = ["0023-audition-current-waveform-editor-kit-row"]

[vcs]
commit-msg = """
improve waveform editor entry and bound selection

Open the existing sample-information screen first for Waveform, Sample Start, and Sample End launchers in Audio Clips and sampled Synths and Kits. An unshifted Select press enters the graphical editor, and Back returns to the same information screen and item, making entry and exit predictable.

Show available sample bounds together and use Shift+Select to switch the controlled playback Start or End, including for reversed samples. Retain the selection when reopening the same sample, reset it for a different sample, and keep unshifted held-Select audition for Kit Sound Drums. The matching release is consumed so releasing Shift first does not trigger another action.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
