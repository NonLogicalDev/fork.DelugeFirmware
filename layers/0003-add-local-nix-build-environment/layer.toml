[layer]
depends-on = ["0001-base"]

[vcs]
commit-msg = """
add local Nix build environment

Add a pinned Nix development shell for Apple Silicon macOS, using the upstream v22 ARM firmware toolchain alongside Git,
Python helpers, pre-commit and ccache. Configure the Deluge build tool and a checkout-local compiler cache through the
shell environment.

Document how to enter the shell, configure an older build directory and produce a local Release binary. This provides a
repeatable local setup for building the firmware without installing or flashing it.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
