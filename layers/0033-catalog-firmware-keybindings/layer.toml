[layer]
depends-on = [
  "0012-add-shift-five-tap-panic-gesture",
  "0016-add-song-grid-track-column-glow",
  "0029-make-preview-only-note-input-release-order-safe",
  "0031-improve-waveform-playhead-visibility",
  "0032-add-kit-choke-groups",
]

[vcs]
commit-msg = """
catalog firmware keybindings

Add a source-backed catalog of physical firmware controls under docs/keybindings. The JSONL records describe gestures,
contexts, actions, conditions, dispatch and release behavior, and source evidence. A control registry distinguishes
physical controls and aliases; a coverage ledger, source snapshot, and findings file support ongoing review.

Add schema validation, input-handler inventory, source-drift and coverage audits, merge support, and tests. The catalog
explicitly records its scope and uncertainties: source review does not prove hardware behavior, complete reachability,
or a conflict merely because gestures overlap. This documentation change does not change firmware controls.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
