[layer]
depends-on = ["0019-keep-waveform-rendering-valid-for-long-samples"]

[vcs]
commit-msg = """
correct reversed waveform row ranges

Mirror a requested half-open waveform column interval [start, end) to [width - end, width - start) for reversed
single-row rendering. This keeps full-width and edge-column requests inside the display and preserves the requested
number of columns.

Reject invalid column ranges before accessing cached peaks, and add tests for full, partial, and edge ranges. This
avoids the off-by-one and out-of-bounds results of the previous mapping.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
