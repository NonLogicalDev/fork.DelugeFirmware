[layer]
depends-on = ["0010-copy-and-paste-kit-rows", "0011-reuse-a-kit-from-manual-slice"]

[vcs]
commit-msg = """
Add Kit row reorder undo infrastructure

Add a note-row reorder action type and a consequence that stores the original and destination indices. When invoked for undo, the consequence reverses those indices; redo moves the row forward again. Reject out-of-range indices before changing the clip's row array.

The layer also documents the intended Kit-row reorder and undo behavior. It introduces the consequence but does not connect it to the reorder gesture in this patch, so the presence of this layer alone does not establish that the gesture records an undo action.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
