[layer]
depends-on = ["0034-add-shared-song-scale-menu"]

[vcs]
commit-msg = """
feat: add precise envelope time controls

Add fine adjustment for Attack, Decay, and Release on the four ordinary sound envelopes.
Display values from 0.00 to 50.00; a Select turn changes whole units, while holding Select
during the turn changes hundredths. Keep any finer stored residual when editing rather
than rounding the parameter to the displayed value first.

Show nominal unmodulated stage time on OLED, including immediate attack, and keep
fractional precision in the envelope graph while preserving its existing scale. Sustain,
DX7 and sidechain envelopes, audio-engine timing, and the saved parameter format remain
unchanged. Add tests for increments, bounds, off-grid values, graph mapping, and nominal
time conversion, and update the keybinding documentation.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
