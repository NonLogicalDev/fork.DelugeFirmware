[layer]
depends-on = []

[vcs]
commit-msg = """
Import the Deluge firmware base

Fetch the firmware tree into the workspace root at the pinned source commit. This supplies the common starting point for the following local layers and keeps the imported Git commit as a parent of the generated layer commit.

Pinning the commit makes the starting tree reproducible while retaining its source history for inspection.
"""

[[operation]]
[operation.git-clone]
url = "git@github.com:NonLogicalDev/fork.DelugeFirmware.git"
dir = ""
ref = "refs/heads/nl/latest"
commit = "9e3132dc17070695b40f69bada5565a33ce428b4"
