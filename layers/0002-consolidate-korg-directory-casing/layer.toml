[layer]
depends-on = ["0001-base"]

[vcs]
commit-msg = """
consolidate Korg directory casing

Move the contributed Korg MIDI preset and device definition files from KORG directories into the existing Korg naming convention. Their content is unchanged.

Using one directory spelling keeps the contributed device files together and avoids parallel paths that differ only by case on case-sensitive filesystems. The moved minilogue xd preset still references the uppercase KORG path, which may not resolve on a case-sensitive filesystem.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
