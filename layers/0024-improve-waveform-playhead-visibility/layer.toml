[layer]
depends-on = [
  "0017-add-recoverable-audio-clip-start-editing",
  "0018-improve-waveform-editor-entry-and-bound-selection",
  "0023-correct-slicer-playhead-source",
]

[vcs]
commit-msg = """
feat: improve waveform playhead visibility

Dim the base waveform to seven eighths of its previous intensity in full-screen Sample
Marker Editor, Slicer, Audio Clip View, and Sample Browser displays, while retaining the
strength of bounds, controls, and playhead overlays. This makes the current position
easier to distinguish over dense waveforms.

Select the playhead only from the exact displayed sample or Clip and add an inverted,
one-column OLED cursor to the Sample Marker Editor and Slicer waveform. Remap it as the
viewport changes and clear it when playback or the view ends. Limit OLED updates to 20 Hz
and avoid redrawing when the projected column has not changed; add tests for source
matching, mapping, and visibility.
"""

[[operation]]
[operation.patch]
file = "changes.patch"
